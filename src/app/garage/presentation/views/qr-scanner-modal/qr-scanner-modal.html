<div class="qr-scanner-modal">
  <div class="modal-header">
    <h2 mat-dialog-title>
      <mat-icon class="title-icon">qr_code_scanner</mat-icon>
      {{ 'garage.qrScanner.title' | translate }}
    </h2>
    <button mat-icon-button (click)="onClose()" class="close-button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content class="modal-content">
    <div *ngIf="vehicle" class="vehicle-info">
      <img
        [src]="vehicle.image"
        [alt]="vehicle.brand + ' ' + vehicle.model"
        class="vehicle-image"
      />
      <div class="vehicle-details">
        <p class="vehicle-name">{{ vehicle.brand }} {{ vehicle.model }}</p>
        <p *ngIf="unlockRequest" class="unlock-code">
          Código: {{ unlockRequest.unlockCode }}
        </p>
      </div>
    </div>

    <div class="qr-placeholder">
      <mat-icon class="qr-icon">qr_code</mat-icon>
      <p class="placeholder-text">
        {{ 'garage.qrScanner.scanHere' | translate }}
      </p>
      <label for="qr-content">Contenido del QR (simulación)</label>
      <input id="qr-content" [(ngModel)]="scannedCode" placeholder="weride:vehicle:1" [disabled]="isScanning" />
      <ng-container *ngIf="vehicle">
        <p class="placeholder-text">{{ 'garage.qrScanner.codeHint' | translate }}: <code>{{ qrContent }}</code></p>
        <button mat-stroked-button type="button" (click)="simulateScan()" [disabled]="isScanning">{{ 'garage.qrScanner.simulateScan' | translate }}</button>
      </ng-container>
      <p *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
      <p *ngIf="isScanning" class="scanning-text">Escaneando...</p>
    </div>
  </div>

  <div mat-dialog-actions class="modal-actions">
    <button mat-button (click)="openManual()" [disabled]="isScanning">Ingresar placa manualmente</button>
    <button
      mat-raised-button
      (click)="onOK()"
      [disabled]="isScanning"
      class="ok-button"
    >
      <span *ngIf="!isScanning">{{ 'garage.qrScanner.ok' | translate }}</span>
      <span *ngIf="isScanning">Escaneando...</span>
    </button>
  </div>
</div>
