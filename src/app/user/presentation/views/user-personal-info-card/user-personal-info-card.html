<div class="personal-info-card">
  <div class="card-content">
    <form *ngIf="personalInfoForm" [formGroup]="personalInfoForm" (ngSubmit)="savePersonalInfo()">
      <div class="profile-picture-section">
        <div class="profile-picture-container">
          <div class="profile-picture" [class.has-image]="profilePicturePreview">
            <img *ngIf="profilePicturePreview" [src]="profilePicturePreview" [alt]="'user.personalInfo.photo' | translate">
            <mat-icon *ngIf="!profilePicturePreview">person</mat-icon>
          </div>
          <label class="upload-button" for="profile-picture-input">
            <mat-icon>photo_camera</mat-icon>
            <span>{{ 'user.personalInfo.changePhoto' | translate }}</span>
          </label>
          <input 
            type="file" 
            id="profile-picture-input" 
            accept="image/*" 
            (change)="onFileSelected($event)"
            style="display: none;">
        </div>
      </div>

      <div class="form-section">
        <div class="form-group">
          <label for="name">
            <mat-icon>person</mat-icon>
            {{ 'user.personalInfo.fullName' | translate }}
          </label>
          <input 
            type="text" 
            id="name" 
            formControlName="name"
            [placeholder]="'user.personalInfo.fullNamePlaceholder' | translate"
            [class.error]="personalInfoForm.get('name')?.invalid && personalInfoForm.get('name')?.touched">
          <span class="error-message" *ngIf="nameError">{{ nameError | translate }}</span>
        </div>

        <div class="form-group">
          <label for="phone">
            <mat-icon>phone</mat-icon>
            {{ 'user.personalInfo.phone' | translate }}
          </label>
          <input 
            type="tel" 
            id="phone" 
            formControlName="phone"
            placeholder="+51987654321"
            [class.error]="personalInfoForm.get('phone')?.invalid && personalInfoForm.get('phone')?.touched">
          <span class="error-message" *ngIf="phoneError">{{ phoneError | translate }}</span>
          <span class="input-hint">{{ 'user.personalInfo.phoneHint' | translate }}</span>
        </div>
      </div>

      <div class="alert-message success" *ngIf="successMessage">
        <mat-icon>check_circle</mat-icon>
        <span>{{ successMessage | translate }}</span>
      </div>

      <div class="alert-message error" *ngIf="errorMessage">
        <mat-icon>error</mat-icon>
        <span>{{ errorMessage | translate }}</span>
      </div>

      <div class="form-actions">
        <button type="button" class="cancel-button" (click)="closeCard()" [disabled]="isLoading">
          {{ 'common.cancel' | translate }}
        </button>
        <button type="submit" class="save-button" [disabled]="isLoading || personalInfoForm.invalid">
          <span *ngIf="!isLoading">{{ 'user.settings.saveChanges' | translate }}</span>
          <span *ngIf="isLoading">{{ 'user.personalInfo.saving' | translate }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
